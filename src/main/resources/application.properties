# =====================================================================
# Configuracion principal - Sistema de Gestion Academica Colaborativa
# =====================================================================
spring.application.name=SpringAle
server.port=${PORT:8080}
app.open-browser=${APP_OPEN_BROWSER:true}

# ------------------------- Base de datos MySQL -----------------------
# Los valores se pueden sobrescribir con variables de entorno.
# Base compatible con phpMyAdmin, MySQL Workbench y Oracle MySQL.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sistema_academico?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# ------------------------- JPA / Hibernate ---------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
# En pruebas se puede sobrescribir con JPA_DIALECT=org.hibernate.dialect.H2Dialect
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.MySQLDialect}

# ------------------------- OpenAPI / Swagger -------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# ------------------------- Seguridad JWT -----------------------------
# En produccion reemplace este secreto por una variable de entorno.
app.jwt.secret=${JWT_SECRET:SpringAle-Clave-Secreta-Super-Segura-2026-Para-JWT-HS256-No-Compartir}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ------------------------- Recordatorios -----------------------------
app.recordatorios.intervalo-ms=${RECORDATORIOS_INTERVALO_MS:3600000}
app.recordatorios.horas-antes=${RECORDATORIOS_HORAS_ANTES:24}

# ------------------------- Logs --------------------------------------
logging.level.org.example.springale=INFO
logging.level.org.springframework.security=WARN
