# Perfil de demostracion local con H2 en memoria.
# Uso: mvn spring-boot:run -Dspring-boot.run.profiles=h2
# o:   java -jar target/SpringAle-0.0.1-SNAPSHOT.jar --spring.profiles.active=h2

spring.datasource.url=jdbc:h2:mem:springale;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=false
app.open-browser=false
